name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild daily so new repositories, stars and languages show up on their own.
  schedule:
    - cron: '20 2 * * *' # 09:20 Asia/Jakarta
  workflow_dispatch:

permissions:
  contents: write # the daily run commits the refreshed repository lists back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Refresh metadata for the highlighted projects. Non-fatal: if GitHub is
      # unreachable the committed data/repos.json is used instead.
      - run: node scripts/highlight-repos.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      # Every public repository, grouped. Non-fatal for the same reason.
      - run: node scripts/all-repos.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
      # Keep the committed lists in step with GitHub, so a build that cannot reach
      # the API still shows yesterday's list rather than an old one. Only on the
      # daily and manual runs; a push made with the workflow token does not start
      # another deploy.
      - name: Commit the refreshed repository lists
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git add data/repos.json data/all-repos.json
          if git diff --cached --quiet; then
            echo "Repository lists unchanged."
            exit 0
          fi
          git config user.name  "Singgih Rochmad Saputro"
          git config user.email "singgih.rochmad@gmail.com"
          git commit -m "Refresh the repository lists"
          git pull --rebase -q origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
